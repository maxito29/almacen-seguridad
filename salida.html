<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Salidas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="container mt-3">

<h3>Registro de Salidas</h3>


<form method="get" th:action="@{/salidas}" class="row mb-3">

    <div class="col-md-4">
        <input type="text" name="texto" class="form-control"
               placeholder="Buscar producto, trabajador o sede"
               th:value="${texto}">
    </div>

    <div class="col-md-3">
        <select name="estado" class="form-control">
            <option value="">Todos</option>
            <option value="1" th:selected="${estado == 1}">Activo</option>
            <option value="0" th:selected="${estado == 0}">Suspendido</option>
        </select>
    </div>

    <div class="col-md-2">
        <button class="btn btn-primary">Buscar</button>
    </div>

    <div class="col-md-3 text-end">
        <button type="button" class="btn btn-success"
                data-bs-toggle="modal" data-bs-target="#modalSalida">
            + Nueva Salida
        </button>
    </div>

</form>

<table class="table table-bordered table-sm">

    <thead class="table-dark">
    <tr>
        <th>#</th>
        <th>Producto</th>
        <th>Trabajador</th>
        <th>Sede</th>
        <th>Cantidad</th>
        <th>Fecha</th>
        <th>Observación</th>
        <th>Estado</th>
        <th>Acciones</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="s : ${lista.content}">

        <td th:text="${s.idSalida}"></td>

        <td>
            <b th:text="${s.producto.descripcion}"></b><br>
            <small class="text-muted"
                   th:text="${s.producto.idProducto}">
            </small>
        </td>

        <td>
            <b th:text="${s.trabajador.nombreCompleto}"></b><br>
            <small class="text-muted"
                   th:text="${s.trabajador.documentoIdentidad}">
            </small>
        </td>

        <td>
            <span class="badge bg-dark"
                  th:text="${s.sede.nombre}">
            </span>
        </td>

        <td>
            <span class="badge bg-success"
                  th:text="${s.cantidad}">
            </span>
        </td>


        <td th:text="${#dates.format(s.fecha,'dd/MM/yyyy')}"></td>


        <td th:text="${s.observacion}"></td>


        <td>
            <span th:if="${s.estado == 1}" class="badge bg-success">Activo</span>
            <span th:if="${s.estado == 0}" class="badge bg-secondary">Suspendido</span>
        </td>


        <td>

            <a th:href="@{'/salidas/editar/' + ${s.idSalida}}"
               class="btn btn-warning btn-sm">
                Editar
            </a>

            <a th:href="@{'/salidas/estado/' + ${s.idSalida}}"
               th:if="${s.estado == 1}"
               class="btn btn-secondary btn-sm">
                Suspender
            </a>

            <a th:href="@{'/salidas/estado/' + ${s.idSalida}}"
               th:if="${s.estado == 0}"
               class="btn btn-success btn-sm">
                Activar
            </a>

        </td>

    </tr>
    </tbody>

</table>

<div>
    <span th:text="'Total: ' + ${lista.totalElements}"></span>
</div>

<div class="modal fade" id="modalSalida" tabindex="-1">

    <div class="modal-dialog">
        <div class="modal-content">

            <form th:action="@{/salidas/guardar}" method="post">

                <div class="modal-header">
                    <h5 class="modal-title">Registrar Salida</h5>
                </div>

                <div class="modal-body">

        
                    <label>Producto</label>
                    <select name="producto.idProducto" class="form-control" required>
                        <option value="">Seleccione</option>
                        <option th:each="p : ${productos}"
                                th:value="${p.idProducto}"
                                th:text="${p.descripcion}">
                        </option>
                    </select>


                    <label class="mt-2">Trabajador</label>
                    <select name="trabajador.idTrabajador" class="form-control" required>
                        <option value="">Seleccione</option>
                        <option th:each="t : ${trabajadores}"
                                th:value="${t.idTrabajador}"
                                th:text="${t.nombreCompleto}">
                        </option>
                    </select>

       
                    <label class="mt-2">Sede</label>
                    <select name="sede.idSede" class="form-control" required>
                        <option value="">Seleccione</option>
                        <option th:each="s : ${sedes}"
                                th:value="${s.idSede}"
                                th:text="${s.nombre}">
                        </option>
                    </select>

                    <label class="mt-2">Cantidad</label>
                    <input type="number" name="cantidad" min="1"
                           class="form-control" required>

                    <label class="mt-2">Observación</label>
                    <textarea name="observacion" class="form-control"></textarea>

                    <input type="hidden" name="estado" value="1">

                </div>

                <div class="modal-footer">
                    <button class="btn btn-primary">Guardar</button>
                    <button type="button" class="btn btn-secondary"
                            data-bs-dismiss="modal">
                        Cerrar
                    </button>
                </div>

            </form>

        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>

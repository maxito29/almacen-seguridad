<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout('Kardex', ~{::section})}">
<body>
<section>

    <!-- titulo y acciones -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h4 class="fw-bold mb-0">
                <i class="fas fa-boxes-stacked text-primary me-2"></i>Kardex de Inventario
            </h4>
            <small class="text-muted">Historial de movimientos de productos</small>
        </div>
        <span class="badge bg-secondary">
            <i class="far fa-clock me-1"></i>Solo Lectura
        </span>
    </div>

    <!-- filtro -->
    <div class="card shadow-sm mb-3">
        <div class="card-body py-2">
            <div class="row g-2 align-items-center">
                <!-- seleccion de productos -->
                <div class="col-md-4">
                    <div class="input-group input-group-sm">
                        <span class="input-group-text">
                            <i class="fas fa-cube"></i>
                        </span>
                        <select id="filtroProducto" class="form-select form-select-sm"
                                onchange="cargarKardex(0)">
                            <option value="">Todos los productos</option>
                            <option th:each="p : ${productos}" 
                                    th:value="${p.idProducto}" 
                                    th:text="${p.descripcion + ' (' + p.idProducto + ')'}">
                            </option>
                        </select>
                    </div>
                </div>

                <!-- selecion de sede -->
                <div class="col-md-3">
                    <div class="input-group input-group-sm">
                        <span class="input-group-text">
                            <i class="fas fa-store"></i>
                        </span>
                        <select id="filtroSede" class="form-select form-select-sm"
                                onchange="cargarKardex(0)">
                            <option value="">Todas las sedes</option>
                            <option th:each="s : ${sedes}" 
                                    th:value="${s.idSede}" 
                                    th:text="${s.nombre}">
                            </option>
                        </select>
                    </div>
                </div>

                <!-- buscra x texto -->
                <div class="col-md-3">
                    <div class="input-group input-group-sm">
                        <span class="input-group-text">
                            <i class="fas fa-search"></i>
                        </span>
                        <input type="text" id="filtroTexto" class="form-control" 
                               placeholder="Buscar por producto o referencia..."
                               onkeyup="if(event.key === 'Enter') cargarKardex(0)">
                    </div>
                </div>
               
                <div class="col-md-2">
                    <button class="btn btn-primary btn-sm w-100" onclick="cargarKardex(0)">
                        <i class="fas fa-search me-1"></i>Buscar
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- tabla -->
    <div class="card card-stat">
        <div class="card-header bg-white py-3">
            <div class="d-flex justify-content-between align-items-center">
                <h5 class="mb-0"><i class="fas fa-list-ul me-2"></i>Movimientos</h5>
                <span id="totalRegistros" class="badge bg-info">0 registros</span>
            </div>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table id="tablaKardex" class="table table-hover mb-0">
                    <thead class="table-header">
                        <tr>
                            <th style="width:140px">Fecha</th>
                            <th>Producto</th>
                            <th style="width:120px">Sede</th>
                            <th style="width:80px">Tipo</th>
                            <th style="width:80px" class="text-end">Cantidad</th>
                            <th style="width:100px" class="text-end">Costo Unit.</th>
                            <th style="width:100px" class="text-end">Total</th>
                            <th style="width:80px" class="text-end">Saldo</th>
                            <th style="width:100px">Referencia</th>
                        </tr>
                    </thead>
                    <tbody id="tablaKardexBody">
                        <tr>
                            <td colspan="9" class="text-center text-muted py-4">
                                <i class="fas fa-spinner fa-spin me-2"></i>Cargando...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- paginacion -->
        <div class="card-footer d-flex justify-content-between align-items-center">
            <small class="text-muted" id="textoMostrando">
                Mostrando <strong id="desde">0</strong> - <strong id="hasta">0</strong> 
                de <strong id="total">0</strong> registros
            </small>
            <div class="d-flex flex-column align-items-center">
                <ul class="pagination align-items-center shadow-sm rounded-pill px-3 py-2 bg-white mb-1" id="paginacion">

                </ul>
                <small class="text-muted" id="textoPaginaBottom">
                    Página <strong id="paginaActualText">1</strong> 
                    de <strong id="totalPaginasText">1</strong>
                </small>
            </div>
        </div>
    </div>

</section>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        cargarKardex(0);
    });
</script>

</body>
</html>

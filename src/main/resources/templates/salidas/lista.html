<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout('Salidas', ~{::section})}">
<body>
<section>

    <!-- Encabezado -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <h4 class="fw-bold mb-0">
                <i class="bi bi-arrow-up-circle text-danger me-2"></i>Salidas
            </h4>
            <small class="text-muted">Registro de entrega de equipos a trabajadores</small>
        </div>
        <a href="/export/salidas/excel" class="btn btn-success btn-sm">
            <i class="bi bi-file-earmark-excel me-1"></i>Exportar en Excel
        </a>
        <a href="/export/salidas/pdf" class="btn btn-danger btn-sm">
            <i class="bi bi-file-earmark-pdf me-1"></i>Exportar en PDF
        </a>
        <button class="btn btn-danger btn-sm"
                data-bs-toggle="modal"
                data-bs-target="#modalSalida"
                onclick="limpiarModalSalida()">
            <i class="bi bi-plus-circle me-1"></i>Nueva Salida
        </button>
    </div>

    <!-- Filtro -->
    <div class="card shadow-sm mb-3">
        <div class="card-body py-2">
            <div class="row g-2 align-items-center">
                <div class="col-md-4">
                    <div class="input-group input-group-sm">
                        <span class="input-group-text">
                            <i class="bi bi-search"></i>
                        </span>
                        <input type="text" id="buscador" class="form-control"
                               placeholder="Buscar por producto, trabajador, sede..."
                               onkeyup="filtrarTabla()"/>
                    </div>
                </div>
                <div class="col-md-3">
					<select id="filtroEstado" class="form-select form-select-sm"
					        onchange="filtrarTablaSalidasLocal()">
                        <option value="">Todos los estados</option>
                        <option value="activo">Activo</option>
                        <option value="suspendido">Suspendido</option>
                    </select>
                </div>
                <div class="col-md-auto ms-auto">
                    <small class="text-muted" id="textoPaginaFiltro">
                        Página <strong th:text="${paginaActual + 1}"></strong>
                        de <strong th:text="${totalPaginas}"></strong>
                        — Total: <strong th:text="${paginado.totalElements}"></strong> registros
                    </small>
                </div>
            </div>
        </div>
    </div>

    <!-- Tabla -->
    <div class="card card-stat">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover mb-0" id="tablaSalidas">
                    <thead class="table-header">
                        <tr>
                            <th style="width:35px">#</th>
                            <th>Producto</th>
                            <th>Trabajador</th>
                            <th>Sede</th>
                            <th style="width:75px">Cant.</th>
                            <th style="width:90px">Fecha</th>
                            <th>Observación</th>
                            <th style="width:85px">Estado</th>
                            <th style="width:75px">Acc.</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="s : ${salidas}"
                            th:classappend="${s.estado == 2} ? 'table-secondary' : ''">
                            <td th:text="${s.idSalida}"></td>
                            <td>
                                <span class="fw-semibold"
                                      th:text="${s.producto.descripcion}"></span>
                                <br/>
                                <small class="text-muted"
                                       th:text="${s.producto.idProducto}"></small>
                            </td>
							<td>
							    <span th:text="${s.trabajador.nombreCompleto}"></span>
							    <br/>
							    <small class="text-muted"
							           th:text="${s.trabajador.documentoIdentidad}"></small>
							</td>
                            <td>
                                <span class="badge bg-dark"
                                      th:text="${s.sede.nombre}"></span>
                            </td>
                            <td>
                                <span class="badge bg-success"
                                      th:text="${s.cantidad}"></span>
                            </td>
                            <td th:text="${#dates.format(s.fecha,'dd/MM/yyyy')}"></td>
                            <td>
                                <small th:text="${s.observacion != null ? s.observacion : '-'}"></small>
                            </td>
                            <td>
                                <span th:if="${s.estado == 1}"
                                      class="badge bg-success">Activo</span>
                                <span th:if="${s.estado == 2}"
                                      class="badge bg-secondary">Suspendido</span>
                            </td>
                            <td>
                                <div class="acciones-btn">
                                    <button class="btn btn-warning btn-sm"
                                            data-bs-toggle="modal"
                                            data-bs-target="#modalSalida"
                                            th:data-id="${s.idSalida}"
                                            th:data-producto="${s.producto.idProducto}"
                                            th:data-trabajador="${s.trabajador.idTrabajador}"
                                            th:data-sede="${s.sede.idSede}"
                                            th:data-cantidad="${s.cantidad}"
                                            th:data-observacion="${s.observacion}"
                                            th:data-estado="${s.estado}"
                                            onclick="editarSalida(this)">
                                        <i class="bi bi-pencil"></i>
                                    </button>
									<a href="javascript:void(0)"
									   th:data-url="@{/salidas/estado/{id}(id=${s.idSalida})}"
									   th:data-estado="${s.estado}"
									   th:class="${s.estado == 1} ? 'btn btn-danger btn-sm' : 'btn btn-success btn-sm'"
									   th:title="${s.estado == 1} ? 'Suspender' : 'Activar'"
									   onclick="confirmarEstadoSalida(this.dataset.url, this.dataset.estado)">
									    <i th:class="${s.estado == 1} ? 'bi bi-pause-circle' : 'bi bi-play-circle'"></i>
									</a>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(salidas)}">
                            <td colspan="9" class="text-center text-muted py-4">
                                No hay salidas registradas
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Paginación -->
        <div class="card-footer d-flex justify-content-between align-items-center">
            <small class="text-muted" id="textoMostrando">
                Mostrando <strong th:text="${salidas.size()}"></strong>
                de <strong th:text="${paginado.totalElements}"></strong> registros
            </small>
            <div class="d-flex flex-column align-items-center">
                <ul class="pagination align-items-center shadow-sm rounded-pill px-3 py-2 bg-white mb-1">

                    <li class="page-item" th:classappend="${paginaActual == 0} ? 'disabled' : ''">
                        <a class="page-link-circular" href="javascript:void(0)"
                           th:onclick="${paginaActual > 0} ? 'irPaginaSalidas(0)' : ''">«</a>
                    </li>

                    <li class="page-item" th:classappend="${paginaActual == 0} ? 'disabled' : ''">
                        <a class="page-link-circular" href="javascript:void(0)"
                           th:onclick="${paginaActual > 0} ? 'irPaginaSalidas(' + ${paginaActual - 1} + ')' : ''">‹</a>
                    </li>

                    <li class="page-item"
                        th:each="i : ${#numbers.sequence(
                            T(java.lang.Math).max(0, paginaActual - 2),
                            T(java.lang.Math).min(totalPaginas - 1, paginaActual + 2))}"
                        th:classappend="${i == paginaActual} ? 'active' : ''">
                        <a th:class="${i == paginaActual}
                                ? 'page-link-circular active'
                                : 'page-link-circular'"
                           href="javascript:void(0)"
                           th:onclick="'irPaginaSalidas(' + ${i} + ')'">
                            <span th:text="${i + 1}"></span>
                        </a>
                    </li>

                    <li class="page-item" th:classappend="${paginaActual == totalPaginas - 1} ? 'disabled' : ''">
                        <a class="page-link-circular" href="javascript:void(0)"
                           th:onclick="${paginaActual < totalPaginas - 1} ? 'irPaginaSalidas(' + ${paginaActual + 1} + ')' : ''">›</a>
                    </li>

                    <li class="page-item" th:classappend="${paginaActual == totalPaginas - 1} ? 'disabled' : ''">
                        <a class="page-link-circular" href="javascript:void(0)"
                           th:onclick="${paginaActual < totalPaginas - 1} ? 'irPaginaSalidas(' + ${totalPaginas - 1} + ')' : ''">»</a>
                    </li>
                </ul>
                <small class="text-muted" id="textoPaginaBottom">
                    Página <strong th:text="${paginaActual + 1}"></strong>
                    de <strong th:text="${totalPaginas}"></strong>
                </small>
            </div>
        </div>

    <!-- Modal para registrar / editar -->
    <div class="modal fade" id="modalSalida" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header modal-header-dark">
                    <h5 class="modal-title" id="tituloModal">
                        <i class="bi bi-arrow-up-circle me-2"></i>Nueva Salida
                    </h5>
                    <button type="button" class="btn-close btn-close-white"
                            data-bs-dismiss="modal"></button>
                </div>
                <form id="formSalida" onsubmit="guardarSalida(event)">
                    <input type="hidden" name="idSalida"  id="idSalida"/>
                    <input type="hidden" name="estado"    id="inputEstado"/>
                    <div class="modal-body">
                        <div class="row g-3">
                            <div class="col-md-12">
                                <label class="form-label fw-semibold">Producto</label>
                                <select class="form-select"
                                        name="producto.idProducto"
                                        id="selectProducto" required>
                                    <option value="">-- Seleccione --</option>
                                    <option th:each="p : ${productos}"
                                            th:value="${p.idProducto}"
                                            th:text="${p.idProducto + ' — ' + p.descripcion}">
                                    </option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Trabajador</label>
                                <select class="form-select"
                                        name="trabajador.idTrabajador"
                                        id="selectTrabajador" required>
                                    <option value="">-- Seleccione --</option>
									<option th:each="t : ${trabajadores}"
									        th:value="${t.idTrabajador}"
									        th:data-dni="${t.documentoIdentidad}"  
									        th:text="${t.nombreCompleto}">
									</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Sede</label>
                                <select class="form-select"
                                        name="sede.idSede"
                                        id="selectSede" required>
                                    <option value="">-- Seleccione --</option>
                                    <option th:each="s : ${sedes}"
                                            th:value="${s.idSede}"
                                            th:text="${s.nombre}">
                                    </option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-semibold">Cantidad</label>
                                <input type="number" class="form-control"
                                       name="cantidad" id="inputCantidad"
                                       min="1" required/>
                            </div>
                            <div class="col-md-8">
                                <label class="form-label fw-semibold">Observación</label>
                                <input type="text" class="form-control"
                                       name="observacion" id="inputObservacion"
                                       placeholder="Ej: RENOVACION DE UNIFORME"/>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary"
                                data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-danger">
                            <i class="bi bi-save me-1"></i>Guardar
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

</section>

<script>
(function() {
    const page = parseInt(new URLSearchParams(window.location.search).get('page') || '0');
    irPaginaSalidas(page);
})();
</script>
</body>
</html>

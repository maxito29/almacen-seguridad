<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Sistema Almacén</title>
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body>

    <div class="container">
        <div class="curved-shape"></div>
        <div class="curved-shape2"></div>

        <div class="form-box Login">
            <h2 class="animation" style="--D:0; --S:21">
                <i class="bi bi-shield-fill-check"></i> Iniciar Sesión
            </h2>

            <!-- Mensaje de error si las credenciales son incorrectas -->
            <div th:if="${param.error}" class="alert-error animation"
                 style="--D:1; --S:22">
                <i class="bi bi-exclamation-circle me-1"></i>
                Usuario o contraseña incorrectos
            </div>

            <!-- Mensaje si cerro sesion -->
            <div th:if="${param.logout}" class="alert-success animation"
                 style="--D:1; --S:22">
                <i class="bi bi-check-circle me-1"></i>
                Sesión cerrada correctamente
            </div>

            <form th:action="@{/login}" method="post">

                <div class="input-box animation" style="--D:1; --S:22">
                    <input type="text" name="username" required autofocus>
                    <label>Usuario</label>
                    <i class="bi bi-person input-icon"></i>
                </div>

                <div class="input-box animation" style="--D:2; --S:23">
                    <input type="password" name="password" required>
                    <label>Contraseña</label>
                    <i class="bi bi-lock input-icon"></i>
                </div>

                <div class="input-box animation" style="--D:3; --S:24">
                    <button class="btn" type="submit">Ingresar</button>
                </div>

            </form>
        </div>

        <div class="info-content Login">
            <h2 class="animation" style="--D:0; --S:20">
                BIENVENIDO
            </h2>
            <p class="animation" style="--D:1; --S:21">
                Sistema de Gestión de Almacén para empresa de
                seguridad privada. Ingresa con tus credenciales
                para continuar.
            </p>
        </div>

    </div>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"/>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout('Productos', ~{::section})}">
<body>
<section>

    <!-- Encabezado -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <h4 class="fw-bold mb-0">
                <i class="bi bi-box-seam text-warning me-2"></i>Productos
            </h4>
            <small class="text-muted">Catálogo de productos del almacén</small>
        </div>
		<a href="/export/productos/excel"
		   class="btn btn-success btn-sm">
		    <i class="bi bi-file-earmark-excel me-1"></i>Exportar en Excel
		</a>
		<a href="/export/productos/pdf"
		   class="btn btn-danger btn-sm">
		    <i class="bi bi-file-earmark-pdf me-1"></i>Exportar en PDF
		</a>
        <button class="btn btn-warning btn-sm text-white"
                data-bs-toggle="modal"
                data-bs-target="#modalProducto"
                onclick="limpiarModalProducto()">
            <i class="bi bi-plus-circle me-1"></i>Nuevo Producto
        </button>
    </div>

    <!-- Filtro -->
    <div class="card shadow-sm mb-3">
        <div class="card-body py-2">
            <div class="row g-2 align-items-center">
                <div class="col-md-4">
                    <div class="input-group input-group-sm">
                        <span class="input-group-text">
                            <i class="bi bi-search"></i>
                        </span>
                        <input type="text" id="buscador" class="form-control"
                               placeholder="Buscar por código o descripción..."
                               onkeyup="filtrarTablaProductos()"/>
                    </div>
                </div>
                <div class="col-md-3">
                    <select id="filtroEstado" class="form-select form-select-sm"
                            onchange="filtrarDesdeSelectProductos(this.value)">
                        <option value="">Todos los estados</option>
                        <option value="activo">Activo</option>
                        <option value="suspendido">Suspendido</option>
                    </select>
                </div>
                <div class="col-md-auto ms-auto">
                    <small class="text-muted">
                        Página <strong th:text="${paginaActual + 1}"></strong>
                        de <strong th:text="${totalPaginas}"></strong>
                        — Total:
                        <strong th:text="${paginado.totalElements}"></strong> registros
                    </small>
                </div>
            </div>
        </div>
    </div>

    <!-- Tabla -->
    <div class="card card-stat">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover mb-0" id="tablaProductos">
                    <thead class="table-header">
                        <tr>
                            <th style="width:90px">Código</th>
                            <th>Descripción</th>
                            <th style="width:100px">Tipo</th>
                            <th class="d-none d-lg-table-cell"
                                style="width:80px">EAN</th>
                            <th style="width:90px">Costo</th>
                            <th class="d-none d-lg-table-cell"
                                style="width:90px">P. Venta</th>
                            <th style="width:70px">Stock</th>
                            <th style="width:85px">Estado</th>
                            <th style="width:75px">Acc.</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="p : ${productos}"
                            th:classappend="${p.estado == 2} ? 'table-secondary' : ''">
                            <td>
                                <span class="fw-semibold text-primary"
                                      th:text="${p.idProducto}"></span>
                            </td>
                            <td th:text="${p.descripcion}"></td>
                            <td>
                                <span class="badge bg-secondary"
                                      th:text="${p.tipo != null ? p.tipo.nombre : '-'}">
                                </span>
                            </td>
                            <td class="d-none d-lg-table-cell text-muted"
                                th:text="${p.eanInt}"></td>
                            <td th:text="${'S/ ' + p.costoUnitario}"></td>
                            <td class="d-none d-lg-table-cell"
                                th:text="${'S/ ' + p.precioVenta}"></td>
                            <td>
                                <span th:classappend="${p.stockTotal == 0}
                                        ? 'badge bg-danger'
                                        : (${p.stockTotal < 10}
                                        ? 'badge bg-warning text-dark'
                                        : 'badge bg-success')"
                                      th:text="${p.stockTotal}">
                                </span>
                            </td>
                            <td>
                                <span th:if="${p.estado == 1}"
                                      class="badge bg-success">Activo</span>
                                <span th:if="${p.estado == 2}"
                                      class="badge bg-secondary">Suspendido</span>
                            </td>
                            <td>
                                <div class="acciones-btn">
                                    <button class="btn btn-warning btn-sm"
                                            data-bs-toggle="modal"
                                            data-bs-target="#modalProducto"
                                            th:data-id="${p.idProducto}"
                                            th:data-ean="${p.eanInt}"
                                            th:data-descripcion="${p.descripcion}"
                                            th:data-tipo="${p.tipo != null ?
                                                           p.tipo.idTipo : ''}"
                                            th:data-costo="${p.costoUnitario}"
                                            th:data-venta="${p.precioVenta}"
                                            th:data-stock="${p.stockTotal}"
                                            th:data-estado="${p.estado}"
                                            onclick="editarProducto(this)">
                                        <i class="bi bi-pencil"></i>
                                    </button>
                                    <a href="javascript:void(0)"
                                       th:data-url="@{/productos/estado/{id}(id=${p.idProducto})}"
                                       th:data-estado="${p.estado}"
                                       th:class="${p.estado == 1}
                                           ? 'btn btn-danger btn-sm'
                                           : 'btn btn-success btn-sm'"
                                       th:title="${p.estado == 1}
                                           ? 'Suspender' : 'Activar'"
                                       onclick="confirmarEstadoProducto(
                                           this.dataset.url, this.dataset.estado)">
                                        <i th:class="${p.estado == 1}
                                            ? 'bi bi-pause-circle'
                                            : 'bi bi-play-circle'"></i>
                                    </a>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(productos)}">
                            <td colspan="9" class="text-center text-muted py-4">
                                No hay productos registrados
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Paginacion -->
        <div class="card-footer d-flex justify-content-between align-items-center">
            <small class="text-muted">
                Mostrando <strong th:text="${productos.size()}"></strong>
                de <strong th:text="${paginado.totalElements}"></strong> registros
            </small>
            <nav>
                <ul class="pagination pagination-sm mb-0">
                    <li class="page-item"
                        th:classappend="${paginaActual == 0} ? 'disabled' : ''">
                        <a class="page-link" href="javascript:void(0)"
                           th:onclick="${paginaActual > 0}
                               ? 'irPaginaProductos(' + ${paginaActual - 1} + ')'
                               : ''">
                            <i class="bi bi-chevron-left"></i>
                        </a>
                    </li>
                    <li class="page-item"
                        th:each="i : ${#numbers.sequence(0, totalPaginas - 1)}"
                        th:classappend="${i == paginaActual} ? 'active' : ''">
                        <a class="page-link" href="javascript:void(0)"
                           th:onclick="'irPaginaProductos(' + ${i} + ')'">
                            <span th:text="${i + 1}"></span>
                        </a>
                    </li>
                    <li class="page-item"
                        th:classappend="${paginaActual == totalPaginas - 1}
                            ? 'disabled' : ''">
                        <a class="page-link" href="javascript:void(0)"
                           th:onclick="${paginaActual < totalPaginas - 1}
                               ? 'irPaginaProductos(' + ${paginaActual + 1} + ')'
                               : ''">
                            <i class="bi bi-chevron-right"></i>
                        </a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal fade" id="modalProducto" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header modal-header-dark">
                    <h5 class="modal-title" id="tituloModalProducto">
                        <i class="bi bi-box-seam me-2"></i>Nuevo Producto
                    </h5>
                    <button type="button" class="btn-close btn-close-white"
                            data-bs-dismiss="modal"></button>
                </div>
                <form id="formProducto" onsubmit="guardarProducto(event)">
                    <input type="hidden" name="estado" id="inputEstadoProducto"/>
                    <div class="modal-body">
                        <div class="row g-3">
                            <div class="col-md-4">
                                <label class="form-label fw-semibold">
                                    Código (ID)
                                </label>
                                <input type="text" class="form-control"
                                       name="idProducto" id="inputIdProducto"
                                       placeholder="Ej: UC0001" required/>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-semibold">EAN</label>
                                <input type="text" class="form-control"
                                       name="eanInt" id="inputEan"
                                       placeholder="Ej: BMLA-B-L"/>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-semibold">Tipo</label>
                                <select class="form-select"
                                        name="tipo.idTipo"
                                        id="selectTipo" required>
                                    <option value="">-- Seleccione --</option>
                                    <option th:each="t : ${tipos}"
                                            th:value="${t.idTipo}"
                                            th:text="${t.nombre}">
                                    </option>
                                </select>
                            </div>
                            <div class="col-md-12">
                                <label class="form-label fw-semibold">
                                    Descripción
                                </label>
                                <input type="text" class="form-control"
                                       name="descripcion" id="inputDescripcion"
                                       placeholder="Ej: Camisa manga larga azul"
                                       required/>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-semibold">
                                    Costo Unitario
                                </label>
                                <div class="input-group">
                                    <span class="input-group-text">S/</span>
                                    <input type="number" step="0.01"
                                           class="form-control"
                                           name="costoUnitario"
                                           id="inputCostoProducto"/>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-semibold">
                                    Precio Venta
                                </label>
                                <div class="input-group">
                                    <span class="input-group-text">S/</span>
                                    <input type="number" step="0.01"
                                           class="form-control"
                                           name="precioVenta"
                                           id="inputVenta"/>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-semibold">
                                    Stock Inicial
                                </label>
                                <input type="number" class="form-control"
                                       name="stockTotal" id="inputStock"
                                       min="0" value="0"/>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary"
                                data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-warning text-white">
                            <i class="bi bi-save me-1"></i>Guardar
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

</section>
</body>
</html>
